<div class="player">
  <div class="player-image" (click)="player.togglePlay()">
    <img [src]="bgPlayer" alt="Micrófono de estudio con filtro antiviento">
    <div class="play-button">
      @if (player.isPlaying()) {
        <nz-icon nzType="pause" nzTheme="outline" />
      } @else {
        <nz-icon nzType="caret-right" nzTheme="outline" />
      }
    </div>
  </div>

  <div class="player-progress">
    <span>{{ player.currentTime() }}</span>
    <input
      type="range"
      min="0"
      [max]="player.duration()"
      [value]="player.progress()"
      (input)="player.seek($event)"
    >
    <span>{{ player.durationText() }}</span>
  </div>
</div>

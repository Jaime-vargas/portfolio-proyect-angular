<button type="button" class="buttonComponent"
        [class.filledButton]="variant() === 'filled'"
        [class.outlineButton]="variant() === 'outline'"
        [class.textButton]="variant() === 'text'">
  <ng-content select="[body]"></ng-content>
  @if (variant() === 'text') {
    <nz-icon nzType="arrow-right" nzTheme="outline"  />
  }
</button>
